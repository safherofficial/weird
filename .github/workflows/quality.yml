name: Quality checks

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: ["main", "feat/**"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Regression tests
        run: npm run test:quality
      - name: Production build
        run: npm run build

  deploy-production:
    name: Deploy Production
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY_GATE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
      statuses: read
    steps:
      - name: Trigger Vercel Production Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -euo pipefail

          if [[ -z "${VERCEL_DEPLOY_HOOK}" ]]; then
            echo "::error::VERCEL_DEPLOY_HOOK is required when the Production deployment gate is enabled."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_code="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --request POST \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --retry-delay 3 \
            --retry-all-errors \
            "$VERCEL_DEPLOY_HOOK")"

          if [[ ! "$http_code" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Vercel Deploy Hook returned HTTP $http_code."
            exit 1
          fi

          if ! jq -e '.job.id | type == "string" and length > 0' "$response_file" >/dev/null; then
            echo "::error::Vercel accepted an unexpected Deploy Hook response."
            exit 1
          fi

          echo "::notice::Vercel accepted the Production deployment request."

      - name: Wait for Vercel Production deployment
        id: vercel-deployment
        uses: vercel/wait-for-deployment-action@0e2b0c5c5cce31f1648108aeec56467187aca037
        with:
          environment: production
          timeout: 600
          check-interval: 10

      - name: Production HTTP smoke check
        env:
          DEPLOYMENT_URL: ${{ steps.vercel-deployment.outputs.deployment-url }}
          DEPLOYMENT_ID: ${{ steps.vercel-deployment.outputs.deployment-id }}
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOYMENT_URL}" ]]; then
            echo "::error::Vercel deployment URL was not returned."
            exit 1
          fi

          status_code="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --connect-timeout 10 \
            --max-time 30 \
            "${DEPLOYMENT_URL%/}/")"

          if [[ ! "${status_code}" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Production smoke check failed with HTTP ${status_code}."
            exit 1
          fi

          echo "::notice::Vercel deployment ${DEPLOYMENT_ID} is READY; root returned HTTP ${status_code}."
