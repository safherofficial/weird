name: Bootstrap npm lockfile

on:
  push:
    branches: ["chore/u01-technical-foundation"]

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/u01-technical-foundation
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore(deps): add npm lockfile"
          git push origin HEAD:chore/u01-technical-foundation
