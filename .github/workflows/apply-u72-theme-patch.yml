name: Apply U72 source patch

on:
  push:
    branches:
      - feat/u72-theme-system

permissions:
  contents: write

jobs:
  apply-u72:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/u72-theme-system
          persist-credentials: true
      - name: Apply and commit the source changes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/u72-patch/part-*.b64 | base64 --decode | xz --decompress --stdout > /tmp/u72.patch
          git apply --check /tmp/u72.patch
          git apply /tmp/u72.patch
          rm -rf .github/u72-patch
          rm -f .github/workflows/apply-u72-theme-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add switchable Department theme system"
          git push origin HEAD:feat/u72-theme-system
